<!DOCTYPE html>
<html lang="ms">
<head>

  <style>
    body {
      font-family: 'Fredoka', cursive, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      background-color: #F0F9FF;
    }
    .btn-bounce:active {
      transform: scale(0.92);
    }
    .floating-anim {
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    .pulse-ring {
      animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .img-card-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 1.5rem;
    }
    .cartoon-canvas {
      width: 100%;
      height: 100%;
      max-height: 240px;
      object-fit: contain;
    }
  </style>
</head>

  <!-- MAIN CONTAINER WITH SCREENS -->

    const firebaseConfig = {
      apiKey: "AIzaSyBOTxKAfHXwQsDEGcv9VWvLerMQ4Z7ke_w",
      authDomain: "tambahkata-138d3.firebaseapp.com",
      databaseURL: "https://tambahkata-138d3-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "tambahkata-138d3",
      storageBucket: "tambahkata-138d3.firebasestorage.app",
      messagingSenderId: "767736875869",
      appId: "1:767736875869:web:291618d1d93b9aa76f36b4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.saveSessionData = function(mode, completed, skipped) {
      try {
        push(ref(db, 'sessions'), {
          mode: mode,
          completedCount: completed,
          skippedCount: skipped,
          timestamp: new Date().toISOString()
        });
      } catch(e) {
        console.log("Firebase sync skipped/offline.");
      }
    };

  <!-- APPLICATION LOGIC & DATA -->
  <script>
    // DATA MODEL (JSON) - 20 ITEMS ACROSS 4 CATEGORIES[cite: 3]
    const dataset = [
      { id: 1, word: "bola", category: "Kata Nama", distractor: "epal" },
      { id: 2, word: "buku", category: "Kata Nama", distractor: "kereta" },
      { id: 3, word: "kereta", category: "Kata Nama", distractor: "buku" },
      { id: 4, word: "epal", category: "Kata Nama", distractor: "bola" },
      { id: 5, word: "kasut", category: "Kata Nama", distractor: "buku" },
      { id: 6, word: "makan", category: "Kata Kerja", distractor: "minum" },
      { id: 7, word: "minum", category: "Kata Kerja", distractor: "makan" },
      { id: 8, word: "lari", category: "Kata Kerja", distractor: "tidur" },
      { id: 9, word: "tidur", category: "Kata Kerja", distractor: "mandi" },
      { id: 10, word: "mandi", category: "Kata Kerja", distractor: "lari" },
      { id: 11, word: "besar", category: "Kata Adjektif", distractor: "kecil" },
      { id: 12, word: "kecil", category: "Kata Adjektif", distractor: "besar" },
      { id: 13, word: "merah", category: "Kata Adjektif", distractor: "biru" },
      { id: 14, word: "biru", category: "Kata Adjektif", distractor: "merah" },
      { id: 15, word: "cantik", category: "Kata Adjektif", distractor: "kecil" },
      { id: 16, word: "ibu", category: "Ahli Keluarga", distractor: "ayah" },
      { id: 17, word: "ayah", category: "Ahli Keluarga", distractor: "ibu" },
      { id: 18, word: "abang", category: "Ahli Keluarga", distractor: "adik" },
      { id: 19, word: "kakak", category: "Ahli Keluarga", distractor: "abang" },
      { id: 20, word: "adik", category: "Ahli Keluarga", distractor: "kakak" }
    ];

    // HTML5 CANVAS CARTOON DRAWING ENGINE
    function renderCartoonCanvas(containerId, key) {
      const container = document.getElementById(containerId);
      container.innerHTML = `<canvas id="canvas-${containerId}" width="300" height="300" class="cartoon-canvas"></canvas>`;
      const canvas = document.getElementById(`canvas-${containerId}`);
      const ctx = canvas.getContext('2d');

      // Clear & Background
      ctx.clearRect(0, 0, 300, 300);
      ctx.fillStyle = "#FFFFFF";
      ctx.fillRect(0, 0, 300, 300);

      // Helper function to draw cartoon eyes
      function drawEyes(x1, y1, x2, y2, r = 6) {
        ctx.fillStyle = "#1E293B";
        ctx.beginPath(); ctx.arc(x1, y1, r, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(x2, y2, r, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#FFFFFF";
        ctx.beginPath(); ctx.arc(x1 - 2, y1 - 2, r / 3, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(x2 - 2, y2 - 2, r / 3, 0, Math.PI * 2); ctx.fill();
      }

      // Helper for cartoon mouth
      function drawMouth(x, y, w = 15) {
        ctx.strokeStyle = "#1E293B";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(x, y, w, 0.1 * Math.PI, 0.9 * Math.PI);
        ctx.stroke();
      }

      switch (key) {
        case "bola":
          ctx.fillStyle = "#F59E0B";
          ctx.beginPath(); ctx.arc(150, 150, 100, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = "#3B82F6"; ctx.lineWidth = 14;
          ctx.beginPath(); ctx.arc(150, 150, 70, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
          ctx.strokeStyle = "#EF4444";
          ctx.beginPath(); ctx.arc(150, 150, 70, 1.2 * Math.PI, 1.8 * Math.PI); ctx.stroke();
          drawEyes(120, 130, 180, 130);
          drawMouth(150, 145);
          break;

        case "buku":
          ctx.fillStyle = "#3B82F6";
          ctx.beginPath(); ctx.roundRect(40, 50, 220, 180, 15); ctx.fill();
          ctx.fillStyle = "#FFF";
          ctx.beginPath(); ctx.roundRect(50, 60, 200, 160, 10); ctx.fill();
          ctx.strokeStyle = "#94A3B8"; ctx.lineWidth = 4;
          ctx.beginPath(); ctx.moveTo(150, 60); ctx.lineTo(150, 220); ctx.stroke();
          drawEyes(100, 110, 200, 110);
          drawMouth(150, 130);
          break;

        case "kereta":
          ctx.fillStyle = "#EF4444";
          ctx.beginPath(); ctx.roundRect(30, 120, 240, 90, 20); ctx.fill();
          ctx.beginPath(); ctx.roundRect(70, 60, 160, 80, 20); ctx.fill();
          ctx.fillStyle = "#BAE6FD";
          ctx.beginPath(); ctx.roundRect(85, 75, 55, 40, 8); ctx.fill();
          ctx.beginPath(); ctx.roundRect(150, 75, 55, 40, 8); ctx.fill();
          // Wheels
          ctx.fillStyle = "#1E293B";
          ctx.beginPath(); ctx.arc(80, 210, 30, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(220, 210, 30, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = "#CBD5E1";
          ctx.beginPath(); ctx.arc(80, 210, 12, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(220, 210, 12, 0, Math.PI * 2); ctx.fill();
          drawEyes(100, 95, 120, 95, 4);
          break;

        case "epal":
          ctx.fillStyle = "#EF4444";
          ctx.beginPath(); ctx.arc(120, 160, 70, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(180, 160, 70, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = "#10B981";
          ctx.beginPath(); ctx.ellipse(170, 75, 25, 12, Math.PI / 4, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = "#78350F"; ctx.lineWidth = 6;
          ctx.beginPath(); ctx.moveTo(150, 100); ctx.lineTo(150, 65); ctx.stroke();
          drawEyes(130, 150, 170, 150);
          drawMouth(150, 165);
          break;

        case "kasut":
          ctx.fillStyle = "#10B981";
          ctx.beginPath(); ctx.roundRect(40, 120, 220, 90, [40, 80, 20, 20]); ctx.fill();
          ctx.fillStyle = "#FFF";
          ctx.fillRect(40, 190, 220, 20);
          ctx.fillStyle = "#38BDF8";
          ctx.beginPath(); ctx.arc(120, 120, 30, 0, Math.PI * 2); ctx.fill();
          drawEyes(160, 150, 190, 150, 5);
          drawMouth(175, 165);
          break;

        case "makan":
          ctx.fillStyle = "#FCD34D";
          ctx.beginPath(); ctx.arc(150, 120, 60, 0, Math.PI * 2); ctx.fill(); // Head
          drawEyes(130, 110, 170, 110);
          // Open mouth with food
          ctx.fillStyle = "#EF4444";
          ctx.beginPath(); ctx.arc(150, 140, 20, 0, Math.PI); ctx.fill();
          // Bowl
          ctx.fillStyle = "#3B82F6";
          ctx.beginPath(); ctx.arc(150, 210, 50, 0, Math.PI); ctx.fill();
          break;

        case "minum":
          ctx.fillStyle = "#FCD34D";
          ctx.beginPath(); ctx.arc(150, 110, 55, 0, Math.PI * 2); ctx.fill();
          drawEyes(130, 100, 170, 100);
          drawMouth(150, 125);
          // Glass
          ctx.fillStyle = "#38BDF8";
          ctx.beginPath(); ctx.roundRect(125, 150, 50, 80, 10); ctx.fill();
          // Straw
          ctx.strokeStyle = "#EF4444"; ctx.lineWidth = 6;
          ctx.beginPath(); ctx.moveTo(150, 125); ctx.lineTo(140, 170); ctx.stroke();
          break;

        case "lari":
          ctx.fillStyle = "#FCD34D";
          ctx.beginPath(); ctx.arc(150, 80, 45, 0, Math.PI * 2); ctx.fill();
          drawEyes(135, 75, 165, 75);
          drawMouth(150, 90);
          // Body & Motion Lines
          ctx.strokeStyle = "#3B82F6"; ctx.lineWidth = 12; ctx.lineCap = "round";
          ctx.beginPath(); ctx.moveTo(150, 125); ctx.lineTo(150, 180); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(150, 180); ctx.lineTo(100, 240); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(150, 180); ctx.lineTo(200, 220); ctx.stroke();
          break;

        case "tidur":
          // Pillow
          ctx.fillStyle = "#E2E8F0";
          ctx.beginPath(); ctx.roundRect(40, 120, 220, 100, 20); ctx.fill();
          // Head
          ctx.fillStyle = "#FCD34D";
          ctx.beginPath(); ctx.arc(120, 160, 45, 0, Math.PI * 2); ctx.fill();
          // Sleeping eyes
          ctx.strokeStyle = "#1E293B"; ctx.lineWidth = 4;
          ctx.beginPath(); ctx.arc(110, 160, 8, 0, Math.PI); ctx.stroke();
          ctx.beginPath(); ctx.arc(135, 160, 8, 0, Math.PI); ctx.stroke();
          // Blanket
          ctx.fillStyle = "#A855F7";
          ctx.beginPath(); ctx.roundRect(140, 140, 120, 90, 10); ctx.fill();
          break;

        case "mandi":
          // Tub
          ctx.fillStyle = "#06B6D4";
          ctx.beginPath(); ctx.roundRect(40, 150, 220, 90, [0, 0, 40, 40]); ctx.fill();
          // Head
          ctx.fillStyle = "#FCD34D";
          ctx.beginPath(); ctx.arc(150, 120, 45, 0, Math.PI * 2); ctx.fill();
          drawEyes(135, 115, 165, 115);
          drawMouth(150, 130);
          // Bubbles
          ctx.fillStyle = "#BAE6FD";
          ctx.beginPath(); ctx.arc(120, 90, 12, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(175, 85, 16, 0, Math.PI * 2); ctx.fill();
          break;

        case "besar":
          ctx.fillStyle = "#EC4899";
          ctx.beginPath(); ctx.arc(150, 150, 110, 0, Math.PI * 2); ctx.fill();
          drawEyes(120, 130, 180, 130, 10);
          drawMouth(150, 160, 25);
          break;

        case "kecil":
          ctx.fillStyle = "#10B981";
          ctx.beginPath(); ctx.arc(150, 150, 40, 0, Math.PI * 2); ctx.fill();
          drawEyes(140, 145, 160, 145, 3);
          drawMouth(150, 155, 6);
          break;

        case "merah":
          ctx.fillStyle = "#EF4444";
          ctx.beginPath(); ctx.roundRect(50, 50, 200, 200, 30); ctx.fill();
          drawEyes(120, 130, 180, 130, 8);
          drawMouth(150, 160, 20);
          break;

        case "biru":
          ctx.fillStyle = "#3B82F6";
          ctx.beginPath(); ctx.roundRect(50, 50, 200, 200, 30); ctx.fill();
          drawEyes(120, 130, 180, 130, 8);
          drawMouth(150, 160, 20);
          break;

        case "cantik":
          // Flower
          ctx.fillStyle = "#EC4899";
          for (let i = 0; i < 6; i++) {
            ctx.beginPath();
            ctx.arc(150 + 50 * Math.cos(i * Math.PI / 3), 150 + 50 * Math.sin(i * Math.PI / 3), 35, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.fillStyle = "#FACC15";
          ctx.beginPath(); ctx.arc(150, 150, 40, 0, Math.PI * 2); ctx.fill();
          drawEyes(135, 140, 165, 140, 5);
          drawMouth(150, 155, 10);
          break;

        case "ibu":
          // Hair
          ctx.fillStyle = "#831843";
          ctx.beginPath(); ctx.arc(150, 130, 75, 0, Math.PI * 2); ctx.fill();
          // Face
          ctx.fillStyle = "#FCD34D";
          ctx.beginPath(); ctx.arc(150, 130, 55, 0, Math.PI * 2); ctx.fill();
          drawEyes(130, 120, 170, 120, 6);
          drawMouth(150, 145, 15);
          // Dress
          ctx.fillStyle = "#EC4899";
          ctx.beginPath(); ctx.roundRect(90, 180, 120, 80, [30, 30, 0, 0]); ctx.fill();
          break;

        case "ayah":
          // Short Hair
          ctx.fillStyle = "#1E293B";
          ctx.beginPath(); ctx.arc(150, 115, 60, 0, Math.PI * 2); ctx.fill();
          // Face
          ctx.fillStyle = "#FCD34D";
          ctx.beginPath(); ctx.arc(150, 125, 55, 0, Math.PI * 2); ctx.fill();
          drawEyes(130, 115, 170, 115, 6);
          drawMouth(150, 140, 15);
          // Shirt
          ctx.fillStyle = "#2563EB";
          ctx.beginPath(); ctx.roundRect(85, 175, 130, 80, [20, 20, 0, 0]); ctx.fill();
          break;

        case "abang":
          // Cap
          ctx.fillStyle = "#F59E0B";
          ctx.beginPath(); ctx.arc(150, 110, 50, Math.PI, 0); ctx.fill();
          ctx.fillRect(100, 105, 100, 10);
          // Face
          ctx.fillStyle = "#FCD34D";
          ctx.beginPath(); ctx.arc(150, 135, 45, 0, Math.PI * 2); ctx.fill();
          drawEyes(135, 130, 165, 130, 5);
          drawMouth(150, 148, 12);
          // Shirt
          ctx.fillStyle = "#10B981";
          ctx.beginPath(); ctx.roundRect(95, 175, 110, 80, [20, 20, 0, 0]); ctx.fill();
          break;

        case "kakak":
          // Ribbon
          ctx.fillStyle = "#F43F5E";
          ctx.beginPath(); ctx.arc(120, 75, 15, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(180, 75, 15, 0, Math.PI * 2); ctx.fill();
          // Face
          ctx.fillStyle = "#FCD34D";
          ctx.beginPath(); ctx.arc(150, 130, 50, 0, Math.PI * 2); ctx.fill();
          drawEyes(132, 125, 168, 125, 5);
          drawMouth(150, 145, 12);
          // Clothes
          ctx.fillStyle = "#FB7185";
          ctx.beginPath(); ctx.roundRect(90, 175, 120, 80, [20, 20, 0, 0]); ctx.fill();
          break;

        case "adik":
          // Baby Face
          ctx.fillStyle = "#FCD34D";
          ctx.beginPath(); ctx.arc(150, 140, 45, 0, Math.PI * 2); ctx.fill();
          // Single Hair Curl
          ctx.strokeStyle = "#78350F"; ctx.lineWidth = 4;
          ctx.beginPath(); ctx.arc(150, 90, 10, 0, Math.PI); ctx.stroke();
          drawEyes(135, 135, 165, 135, 5);
          drawMouth(150, 152, 10);
          // Pacifier
          ctx.fillStyle = "#8B5CF6";
          ctx.beginPath(); ctx.arc(150, 160, 12, 0, Math.PI * 2); ctx.fill();
          break;

        default:
          ctx.fillStyle = "#CBD5E1";
          ctx.beginPath(); ctx.arc(150, 150, 80, 0, Math.PI * 2); ctx.fill();
          break;
      }
    }

    // STATE MANAGEMENT[cite: 3]
    let currentMode = null; // 'pemahaman' | 'ekspresif'[cite: 3]
    let currentIndex = 0;
    let completedCount = 0;
    let skippedCount = 0;
    let activeQuestionData = null;
    let correctOptionIndex = 0;
    let isListening = false;
    let recognition = null;

    // AUDIO SYNTHESIS & TTS[cite: 3]
    function speakText(text, callback) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ms-MY';
        utterance.rate = 0.85; // Slower rate for SLD clarity[cite: 3]
        utterance.pitch = 1.1; // Friendly tone[cite: 3]
        if (callback) utterance.onend = callback;
        window.speechSynthesis.speak(utterance);
      } else if(callback) {
        callback();
      }
    }

    function playSoundEffect(type) {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);

      if (type === 'correct') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(400, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      } else {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(150, ctx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
        osc.start();
        osc.stop(ctx.currentTime + 0.2);
      }
    }

    const praises = ["Hebat!", "Pandai!", "Tahniah!", "Bagus!", "Bijak!", "Syabas!", "Excellent!", "Good Job!", "Wow!", "Terbaik!"];[cite: 3]
    function getRandomPraise() {
      return praises[Math.floor(Math.random() * praises.length)];
    }

    // NAVIGATION[cite: 3]
    function goToHome() {
      stopSpeechRecognition();
      document.getElementById('screen-home').classList.remove('hidden');
      document.getElementById('screen-pemahaman').classList.add('hidden');
      document.getElementById('screen-ekspresif').classList.add('hidden');
      document.getElementById('screen-summary').classList.add('hidden');
      document.getElementById('stats-pill').classList.add('hidden');
    }

    function startActivity(mode) {
      currentMode = mode;
      currentIndex = 0;
      completedCount = 0;
      skippedCount = 0;

      document.getElementById('screen-home').classList.add('hidden');
      document.getElementById('stats-pill').classList.remove('hidden');

      if (mode === 'pemahaman') {
        document.getElementById('screen-pemahaman').classList.remove('hidden');
        loadPemahamanItem();
      } else {
        document.getElementById('screen-ekspresif').classList.remove('hidden');
        setupSpeechRecognition();
        loadEkspresifItem();
      }
    }

    function updateStatsPill() {
      document.getElementById('current-index').textContent = currentIndex + 1;
      document.getElementById('total-items').textContent = dataset.length;
    }

    // PEMAHAMAN ACTIVITY LOGIC[cite: 3]
    function loadPemahamanItem() {
      if (currentIndex >= dataset.length) {
        finishSession();
        return;
      }
      updateStatsPill();
      activeQuestionData = dataset[currentIndex];

      const promptText = `Mana ${activeQuestionData.word}?`;
      document.getElementById('pemahaman-prompt').textContent = `"${promptText}"`;

      // Randomize Left/Right Placement[cite: 3]
      correctOptionIndex = Math.random() < 0.5 ? 0 : 1;
      const optionAKey = correctOptionIndex === 0 ? activeQuestionData.word : activeQuestionData.distractor;
      const optionBKey = correctOptionIndex === 1 ? activeQuestionData.word : activeQuestionData.distractor;

      renderCartoonCanvas('option-a-img', optionAKey);
      renderCartoonCanvas('option-b-img', optionBKey);

      // Reset styles[cite: 3]
      document.getElementById('option-a-card').className = "btn-bounce bg-white p-3 rounded-3xl shadow-xl border-4 border-slate-200 hover:border-emerald-400 cursor-pointer flex flex-col items-center justify-center transition-all h-64 md:h-72";
      document.getElementById('option-b-card').className = "btn-bounce bg-white p-3 rounded-3xl shadow-xl border-4 border-slate-200 hover:border-emerald-400 cursor-pointer flex flex-col items-center justify-center transition-all h-64 md:h-72";

      playInstructionAudio();
    }

    function playInstructionAudio() {
      if (currentMode === 'pemahaman') {
        speakText(`Mana ${activeQuestionData.word}`);
      } else if (currentMode === 'ekspresif') {
        speakText("Apa ini?");
      }
    }

    function checkPemahamanAnswer(selectedIndex) {
      if (selectedIndex === correctOptionIndex) {
        playSoundEffect('correct');
        completedCount++;
        showFeedbackModal(true, getRandomPraise());
      } else {
        playSoundEffect('wrong');
        const selectedCard = selectedIndex === 0 ? document.getElementById('option-a-card') : document.getElementById('option-b-card');
        selectedCard.classList.add('border-rose-400', 'bg-rose-50');
        showFeedbackModal(false, "Cuba lagi.");
      }
    }

    // EKSPRESIF ACTIVITY LOGIC[cite: 3]
    function loadEkspresifItem() {
      if (currentIndex >= dataset.length) {
        finishSession();
        return;
      }
      updateStatsPill();
      activeQuestionData = dataset[currentIndex];

      renderCartoonCanvas('ekspresif-img', activeQuestionData.word);
      document.getElementById('speech-recognized-text').textContent = "";
      playInstructionAudio();
    }

    function evaluateEkspresif(isCorrect) {
      stopSpeechRecognition();
      if (isCorrect) {
        playSoundEffect('correct');
        completedCount++;
        showFeedbackModal(true, getRandomPraise(), activeQuestionData.word);
      } else {
        playSoundEffect('wrong');
        showFeedbackModal(false, "Cuba lagi.", `Sebut: "${activeQuestionData.word}"`);
      }
    }

    // SPEECH RECOGNITION (WEB SPEECH API)[cite: 3]
    function setupSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'ms-MY';
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onstart = () => {
          isListening = true;
          document.getElementById('mic-btn').classList.add('pulse-ring', 'bg-red-600');
          document.getElementById('mic-label').textContent = "Mendengar...";
        };

        recognition.onresult = (event) => {
          const transcript = event.results[0][0].transcript.toLowerCase();
          document.getElementById('speech-recognized-text').textContent = `"${transcript}"`;
          
          const target = activeQuestionData.word.toLowerCase();
          if (transcript.includes(target)) {
            evaluateEkspresif(true);
          } else {
            evaluateEkspresif(false);
          }
        };

        recognition.onerror = () => { stopSpeechRecognition(); };
        recognition.onend = () => { stopSpeechRecognition(); };
      } else {
        document.getElementById('mic-btn').style.display = 'none';
      }
    }

    function toggleSpeechRecognition() {
      if (!recognition) return;
      if (isListening) {
        stopSpeechRecognition();
      } else {
        try { recognition.start(); } catch(e){}
      }
    }

    function stopSpeechRecognition() {
      isListening = false;
      if (recognition) try { recognition.stop(); } catch(e){}
      const micBtn = document.getElementById('mic-btn');
      if (micBtn) {
        micBtn.classList.remove('pulse-ring', 'bg-red-600');
        document.getElementById('mic-label').textContent = "Tekan & Sebut";
      }
    }

    // SKIP & FEEDBACK[cite: 3]
    function skipItem() {
      skippedCount++;
      nextItem();
    }

    function nextItem() {
      currentIndex++;
      if (currentMode === 'pemahaman') loadPemahamanItem();
      else loadEkspresifItem();
    }

    function showFeedbackModal(isSuccess, title, subtitle = "") {
      const modal = document.getElementById('feedback-modal');
      const card = document.getElementById('feedback-card');
      const stars = document.getElementById('feedback-stars');
      const titleEl = document.getElementById('feedback-title');
      const subEl = document.getElementById('feedback-subtitle');

      modal.classList.remove('hidden');

      if (isSuccess) {
        stars.classList.remove('hidden');
        titleEl.textContent = title;
        titleEl.className = "text-3xl font-extrabold text-emerald-600";
        card.className = "bg-white rounded-3xl p-8 max-w-sm w-full shadow-2xl border-4 border-emerald-400 flex flex-col items-center text-center gap-4";
        confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });
        speakText(title);
      } else {
        stars.classList.add('hidden');
        titleEl.textContent = title;
        titleEl.className = "text-3xl font-extrabold text-amber-600";
        card.className = "bg-white rounded-3xl p-8 max-w-sm w-full shadow-2xl border-4 border-amber-300 flex flex-col items-center text-center gap-4";
        speakText(title);
      }

      subEl.textContent = subtitle;
      document.getElementById('feedback-btn').onclick = () => {
        closeFeedbackModal();
        if (isSuccess) nextItem();
      };
    }

    function closeFeedbackModal() {
      document.getElementById('feedback-modal').classList.add('hidden');
    }

    // FINISH SESSION[cite: 3]
    function finishSession() {
      stopSpeechRecognition();
      document.getElementById('screen-pemahaman').classList.add('hidden');
      document.getElementById('screen-ekspresif').classList.add('hidden');
      document.getElementById('stats-pill').classList.add('hidden');
      document.getElementById('screen-summary').classList.remove('hidden');

      document.getElementById('summary-completed').textContent = completedCount;
      document.getElementById('summary-skipped').textContent = skippedCount;

      confetti({ particleCount: 120, spread: 100, origin: { y: 0.5 } });
      speakText("Tahniah! Anda berjaya menyiapkan latihan TambahKata.");

      if (window.saveSessionData) {
        window.saveSessionData(currentMode, completedCount, skippedCount);
      }
    }

    function restartActivity() {
      startActivity(currentMode);
    }
  </script>
